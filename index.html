<!DOCTYPE html>
<html lang="fr-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale=1.O>
    <title>Creation d'un compte</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="creation.css">
</head>
<body>
    <header>
        <div class="card-main">
            <div class="header">
                <img src="logo.png" alt="logo" width="50">
                <h2>ECOLE MODERNE</h2>
                <p>Veillez Crée votre compte pour avoir plus d'informations</p>
            </div>
            <div class="main">
                <form action="">
                    <div class="footer">
                        <label>Nom Complet</label><br>
                        <input type="text" id="" name="" placeholder="Ecrit votre nom complet"><br>

                        <label>Email</label><br>
                        <input type="email" id="" name="" placeholder="Ecrit votre email"><br>

                        <label>Creation du mot de passe</label><br>
                        <input type="password" id="" name="" placeholder="Crée votre mot de passe"><br>

                        <label>Confirmation du Mot de passe</label><br>
                        <input type="password" id="" name="" placeholder="Confirmé votre mot de passe"><br>

                    </div>
                    <div class="btn">
                        <button>Confirmation</button>
                    </div>
                </form>
                <div class="card-head">
                    <p>Si vous avez déjà un compte cliquer sur</p>
                    <a href="">Se Connecter ?</a>
                </div>
                <p>Merci de se connecter sur notre page pour plus d'infos veiller contacter nos bureaux</p>
            </div>
        </div>
    </header>
</body>
</html>
